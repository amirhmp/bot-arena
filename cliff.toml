# git-cliff configuration: generates CHANGELOG.md from Conventional Commits.
# `pnpm release` (scripts/release.ts) drives this for versioning; `pnpm changelog` is a manual preview.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
This file is generated by git-cliff from commit messages. Do not edit by hand.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = false
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
# Exactly vMAJOR.MINOR.PATCH, no suffix. Keep in sync with SEMVER_TAG_RE in scripts/release.ts.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "oldest"
commit_parsers = [
  # The release commits made by scripts/release.ts are not changelog entries.
  { message = '^chore\(release\)', skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^build|^ci", group = "Build and CI" },
  { message = "^chore|^style", group = "Miscellaneous" },
]
