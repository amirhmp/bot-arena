# Shared services. Use together with compose.dev.yaml or compose.prod.yaml.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botarena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botarena}
      POSTGRES_DB: ${POSTGRES_DB:-botarena}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  seq:
    image: datalust/seq:2025
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?set SEQ_ADMIN_PASSWORD in .env}
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
  seq-data:
